<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="cyberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#7928ca" />
      <stop offset="100%" stop-color="#ff0080" />
    </linearGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield Polygon -->
  <polygon points="250,30 430,120 430,350 250,470 70,350 70,120" 
           fill="#070a12" stroke="url(#cyberGlow)" stroke-width="8" filter="url(#glowEffect)" />

  <!-- Inner Geometric Nexo 'N' -->
  <path d="M 160 360 L 160 140 L 220 140 L 290 280 L 290 140 L 340 140 L 340 360 L 280 360 L 210 220 L 210 360 Z" 
        fill="url(#cyberGlow)" filter="url(#glowEffect)" />

  <!-- Center Core Circuit Node -->
  <circle cx="250" cy="250" r="16" fill="#00f0ff" />
  <line x1="250" y1="230" x2="250" y2="170" stroke="#00f0ff" stroke-width="4" stroke-dasharray="4,4" />
  <line x1="250" y1="270" x2="250" y2="330" stroke="#00f0ff" stroke-width="4" stroke-dasharray="4,4" />
</svg>
