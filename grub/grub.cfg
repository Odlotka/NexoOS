# ==============================================================================
# NexoOS GRUB Bootloader Configuration (UEFI & BIOS)
# Multi-Kernel Tiering, HiDPI Dark Theme, Snapshot & Diagnostics Integration
# ==============================================================================

set default="0"
set timeout=10

insmod font
insmod all_video
insmod gfxterm
insmod png
insmod gettext

loadfont /boot/grub/fonts/unicode.pf2

set gfxmode=auto,1920x1080,1280x720
set gfxpayload=keep
terminal_output gfxterm

# Set theme
set theme=/boot/grub/themes/nexoos/theme.txt

# Search root UUID or label
search --no-floppy --set=root --label %ARCHISO_LABEL%

# ------------------------------------------------------------------------------
# 1. Primary Default: linux-zen (Ultra-low latency, EEVDF scheduling, Gaming)
# ------------------------------------------------------------------------------
menuentry "NexoOS (x86_64) - Zen Kernel [Default / Gaming & Low-Latency]" --class nexo --class zen --class gnu-linux {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-zen archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% quiet splash loglevel=3 rd.udev.log_priority=3 vt.global_cursor_default=0 cow_spacesize=4G
    initrd /%INSTALL_DIR%/boot/intel-ucode.img /%INSTALL_DIR%/boot/amd-ucode.img /%INSTALL_DIR%/boot/x86_64/initramfs-linux-zen.img
}

# ------------------------------------------------------------------------------
# 2. Hardened Security Profile: linux-hardened (Mitigations & Isolation)
# ------------------------------------------------------------------------------
menuentry "NexoOS (x86_64) - Hardened Kernel [High-Security & Forensics]" --class nexo --class hardened --class gnu-linux {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-hardened archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% quiet splash loglevel=3 slab_nomerge slub_debug=FZP page_poison=1 init_on_alloc=1 init_on_free=1 cow_spacesize=4G
    initrd /%INSTALL_DIR%/boot/intel-ucode.img /%INSTALL_DIR%/boot/amd-ucode.img /%INSTALL_DIR%/boot/x86_64/initramfs-linux-hardened.img
}

# ------------------------------------------------------------------------------
# 3. Fallback / Recovery: linux-lts (Guaranteed Stability & Driver Recovery)
# ------------------------------------------------------------------------------
menuentry "NexoOS (x86_64) - LTS Kernel [Long-Term Stability Fallback]" --class nexo --class lts --class gnu-linux {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-lts archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% nomodeset cow_spacesize=4G
    initrd /%INSTALL_DIR%/boot/intel-ucode.img /%INSTALL_DIR%/boot/amd-ucode.img /%INSTALL_DIR%/boot/x86_64/initramfs-linux-lts.img
}

# ------------------------------------------------------------------------------
# 4. Btrfs Snapshot Browser Sub-Menu (Post-Installation Rollbacks)
# ------------------------------------------------------------------------------
submenu "NexoOS Btrfs Snapshots & System Rollbacks -->" --class snapshot {
    menuentry "Snapshot Rollback Browser (grub-btrfs hook)" {
        echo "Searching for local Btrfs snapshot configurations..."
        search --no-floppy --file --set=btrfs_root /@snapshots/grub-btrfs.cfg
        if [ -f ($btrfs_root)/@snapshots/grub-btrfs.cfg ]; then
            configfile ($btrfs_root)/@snapshots/grub-btrfs.cfg
        else
            echo "No installed Btrfs snapshot hierarchy found on live media."
            echo "Press ESC to return."
            sleep 3
        fi
    }
}

# ------------------------------------------------------------------------------
# 5. Hardware Diagnostics: Memtest86+
# ------------------------------------------------------------------------------
if [ -f /boot/memtest86+/memtest.bin ]; then
    menuentry "Run Hardware Diagnostic (Memtest86+)" --class memtest {
        linux16 /boot/memtest86+/memtest.bin
    }
fi

if [ -f /boot/memtest86+/memtest.efi ]; then
    menuentry "Run Hardware Diagnostic (Memtest86+ UEFI)" --class memtest {
        chainloader /boot/memtest86+/memtest.efi
    }
fi

# ------------------------------------------------------------------------------
# 6. Firmware & System Controls
# ------------------------------------------------------------------------------
if [ "$grub_platform" = "efi" ]; then
    menuentry "UEFI Firmware Setup (BIOS Setup)" --class efi {
        fwsetup
    }
fi

menuentry "Reboot System" --class reboot {
    reboot
}

menuentry "Power Off System" --class shutdown {
    halt
}
