# ==============================================================================
# /etc/calamares/modules/locale.conf - Language & Regional Settings
# ==============================================================================

# Default language shown during installation
localeGenPath: "/etc/locale.gen"

# Fallback region and zone
region: "Europe"
zone: "Warsaw"

# Language defaults to English on the installer boot, then adopts the user's choice
defaultLocale: "en_US.UTF-8"
