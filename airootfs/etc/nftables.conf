#!/usr/bin/nft -f
# ==============================================================================
# /etc/nftables.conf - NexoOS Stateful Firewall & Stealth Killswitch Ruleset
# ==============================================================================

flush ruleset

table inet filter {
    chain input {
        type filter hook input priority filter; policy drop;

        # Allow traffic on loopback
        iif "lo" accept

        # Allow established and related connections
        ct state established,related accept

        # Drop invalid packets
        ct state invalid drop

        # ICMP echo-request rate limiting (anti-ping flood)
        ip protocol icmp icmp type echo-request limit rate 5/second accept
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
    }

    chain output {
        type filter hook output priority filter; policy accept;

        # Standard egress is accepted by default.
        # When Nexo Stealth Killswitch is engaged, this policy switches to drop
        # permitting ONLY Tor (UID of tor user: 43 or debian-tor) and Loopback.
    }
}
