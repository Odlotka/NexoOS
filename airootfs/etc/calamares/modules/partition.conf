# ==============================================================================
# /etc/calamares/modules/partition.conf - Btrfs Storage Architecture
# ==============================================================================

efiSystemPartition: "/boot/efi"
efiSystemPartitionSize: 512M
userSwapChoices:
  - none
  - small
  - suspend
  - file

drawNestedPartitions: false
alwaysShowPartitionLabels: true
initialPartitioningChoice: erase
initialSwapChoice: none
defaultFileSystemType: "btrfs"

btrfsSubvolumes:
  - mountPoint: /
    subvolume: /@
  - mountPoint: /home
    subvolume: /@home
  - mountPoint: /var/log
    subvolume: /@var_log
  - mountPoint: /.snapshots
    subvolume: /@snapshots

btrfsMountOptions:
  - compress=zstd:3
  - noatime
  - space_cache=v2
