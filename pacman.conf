#
# /etc/pacman.conf - NexoOS Pacman Configuration
# Includes Arch Official, Multilib, and BlackArch Repositories
#

[options]
HoldPkg     = pacman glibc
Architecture = auto

# Output and visual enhancements
Color
CheckSpace
VerbosePkgLists
ParallelDownloads = 8
ILoveCandy

SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

# ---------------------------------------------------------
# Official Arch Linux Repositories
# ---------------------------------------------------------

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist

# ---------------------------------------------------------
# BlackArch Linux Security Repository
# ---------------------------------------------------------

[blackarch]
SigLevel = Optional TrustAll
Server = https://blackarch.org/blackarch/$repo/os/$arch
Server = https://mirror.datacenter.by/pub/blackarch/$repo/os/$arch
Server = https://mirrors.netix.net/blackarch/$repo/os/$arch
Server = https://mirror.cspacehostings.com/blackarch/$repo/os/$arch
Server = https://ftp.halifax.rwth-aachen.de/blackarch/$repo/os/$arch
