name: Build NexoOS ISO Image

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sed -i 's/SigLevel    = Required DatabaseOptional/SigLevel = Never/' /etc/pacman.conf || true
          pacman -Sy --noconfirm archlinux-keyring
          pacman -S --noconfirm archiso dosfstools mtools grub libisoburn

      - name: Build NexoOS ISO
        run: |
          mkdir -p out /tmp/work
          mkarchiso -v -w /tmp/work -o out .

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexoOS-x86_64-ISO
          path: out/*.iso
          retention-days: 7
