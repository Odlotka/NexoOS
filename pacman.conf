#
# /etc/pacman.conf - NexoOS Pacman Configuration
# Includes Arch Official, Multilib, BlackArch, and Chaotic-AUR Repositories
#

[options]
HoldPkg     = pacman glibc
Architecture = auto

# Output and visual enhancements
Color
CheckSpace
VerbosePkgLists
ParallelDownloads = 8
ILoveCandy

SigLevel    = Never
LocalFileSigLevel = Never

# ---------------------------------------------------------
# Official Arch Linux Repositories
# ---------------------------------------------------------

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist

# ---------------------------------------------------------
# Chaotic-AUR (Precompiled Binaries: Calamares, Wlogout, SWWW, MPVPaper)
# ---------------------------------------------------------

[chaotic-aur]
SigLevel = Never
Server = https://cdn-mirror.chaotic.cx/$repo/$arch
Server = https://geo-mirror.chaotic.cx/$repo/$arch
Server = https://us-mi-mirror.chaotic.cx/$repo/$arch

# ---------------------------------------------------------
# BlackArch Linux Security Repository
# ---------------------------------------------------------

[blackarch]
SigLevel = Never
Server = https://blackarch.org/blackarch/$repo/os/$arch
Server = https://mirror.datacenter.by/pub/blackarch/$repo/os/$arch
Server = https://mirrors.netix.net/blackarch/$repo/os/$arch
Server = https://mirror.cspacehostings.com/blackarch/$repo/os/$arch
