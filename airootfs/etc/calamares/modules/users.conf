# ==============================================================================
# /etc/calamares/modules/users.conf - User Account Provisioning
# ==============================================================================

# Default groups for newly created regular user
defaultGroups:
  - wheel
  - users
  - video
  - audio
  - storage
  - input
  - power
  - network

# Autologin configuration (disabled by default for security, toggleable in installer)
autologinGroup: autologin
doAutologin: false

# Sudo configuration (grant wheel full sudo privileges)
sudoersGroup: wheel
setRootPassword: true
doReusePassword: true

# Hostname defaults
defaultHostname: nexo-station
writeHostsFile: true
