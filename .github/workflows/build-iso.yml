name: Build NexoOS ISO Image

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space on Runner
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build NexoOS ISO inside Arch Linux Container
        run: |
          docker run --privileged --rm -v "${{ github.workspace }}:/build" -w /build archlinux:latest bash -c "
            sed -i 's/SigLevel    = Required DatabaseOptional/SigLevel = Never/' /etc/pacman.conf || true
            pacman -Sy --noconfirm archlinux-keyring
            pacman -S --noconfirm archiso dosfstools mtools grub libisoburn
            cd /build
            mkarchiso -v -w /tmp/work -o /build/out /build
          "

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexoOS-x86_64-ISO
          path: out/*.iso
          retention-days: 7
